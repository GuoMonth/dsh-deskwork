name: Desktop preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-preview:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run experiment:prepare
      - run: npm run build
      - run: node --test tests/runtime.integration.ts tests/desktop.integration.ts tests/browser-boundary.integration.ts
      - run: npm run package:mac > .artifacts/package-mac.log 2>&1
        env:
          # Preview uses ad-hoc signing only; this job receives no signing credentials.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify DMG installation and packaged runtime
        shell: bash
        run: |
          images=(.artifacts/releases/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          installation=$(mktemp -d)
          mountpoint=$(mktemp -d)
          trap 'hdiutil detach "$mountpoint"; rm -rf "$installation" "$mountpoint"' EXIT
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          test -L "$mountpoint/Applications"
          ditto "$mountpoint/DSH Deskwork.app" "$installation/DSH Deskwork.app"
          codesign --verify --deep --strict --verbose=2 "$installation/DSH Deskwork.app"
          codesign --display --verbose=4 "$installation/DSH Deskwork.app"
          node scripts/verify-package.ts --app "$installation/DSH Deskwork.app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-preview
          path: |
            .artifacts/releases/*.dmg
            .artifacts/desktop/
            .artifacts/package-mac.log
          if-no-files-found: error
          retention-days: 14
